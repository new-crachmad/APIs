receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  docker_stats:
    endpoint: "unix:///var/run/docker.sock"
    collection_interval: 60s
    timeout: 20s

  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "otel-collector"
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch:

exporters:
  otlphttp/metrics:
    endpoint: "${VM_IP}:9090/api/v1/otlp"
    tls:
      insecure: true

  otlphttp/traces:
    endpoint: "${VM_IP}:4318"
    tls:
      insecure: true

  otlphttp/logs:
    endpoint: "${VM_IP}:3100/otlp"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]

    metrics:
      receivers: [otlp, docker_stats, prometheus/collector]
      processors: [batch]
      exporters: [otlphttp/metrics]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
