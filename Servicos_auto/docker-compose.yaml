services:
  database:
    image: postgres:15
    container_name: servicos_auto_db
    restart: always
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: servicos_auto
      POSTGRES_PASSWORD: servicos_auto
      POSTGRES_DB: servicos_auto
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata_servicos_auto:/var/lib/postgresql/data
    networks:
      - sentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicos_auto"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentinel-otel:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sentinel-otel
    restart: always
    command: [--config /etc/otelcol-contrib/config.yaml]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - sentinel

  servicos_auto:
    build:
      context: .
      dockerfile: dockerfile
    container_name: servicos_auto_api
    restart: always
    ports:
      - "8085:8085"
    depends_on:
      database:
        condition: service_healthy
      sentinel-otel:
        condition: service_started
    
     
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/servicos_auto
      SPRING_DATASOURCE_USERNAME: servicos_auto
      SPRING_DATASOURCE_PASSWORD: servicos_auto
      
      #--- Credenciais do Imgur - SUBSTITUA PELOS SEUS VALORES REAIS ---
      IMGUR_CLIENT_ID: "COLOQUE_SEU_CLIENT_ID_AQUI"
      IMGUR_CLIENT_SECRET: "COLOQUE_SEU_CLIENT_SECRET_AQUI"
      IMGUR_REFRESH_TOKEN: "COLOQUE_SEU_REFRESH_TOKEN_AQUI"

      #--- Configuração do OpenTelemetry ---
      OTEL_EXPORTER_OTLP_ENDPOINT: http://sentinel-otel:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf # Força o uso do protocolo HTTP
      OTEL_SERVICE_NAME: servicos_auto_api
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
    networks:
      - sentinel

volumes:
  pgdata_servicos_auto:

networks:
  sentinel:
    driver: bridge
