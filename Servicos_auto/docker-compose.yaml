version: "3.9"

services:
  database:
    image: postgres:15
    container_name: servicos_auto_db
    restart: always
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: servicos_auto
      POSTGRES_PASSWORD: servicos_auto
      POSTGRES_DB: servicos_auto
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata_servicos_auto:/var/lib/postgresql/data
    networks:
      - sentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicos_auto"]
      interval: 10s
      timeout: 5s
      retries: 5

  servicos_auto:
    build:
      context: .
      dockerfile: dockerfile
    container_name: servicos_auto_api
    restart: always
    ports:
      - "8085:8085"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/servicos_auto
      SPRING_DATASOURCE_USERNAME: servicos_auto
      SPRING_DATASOURCE_PASSWORD: servicos_auto
      
      CLOUDINARY_CLOUD_NAME: "your_cloud_name"
      CLOUDINARY_API_KEY: "your_api_key"
      CLOUDINARY_API_SECRET: "your_api_secret"

      # OpenTelemetry (enviando para o Sentinel separado)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://sentinel-otel:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: servicos_auto_api
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar

    networks:
      - sentinel

volumes:
  pgdata_servicos_auto:

networks:
  sentinel:
    external: true
