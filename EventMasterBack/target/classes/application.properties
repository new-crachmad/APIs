# ======================
# CONFIGURAÇÕES DO BANCO
# ======================
spring.datasource.url=jdbc:postgresql://eventmaster-db:5432/eventmasterdb
spring.datasource.username=eventuser
spring.datasource.password=eventpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta interna da aplicação (Dockerfile expõe 8080)
server.port=8080

# ======================
# LOGS SQL (opcional)
# ======================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ======================
# ACTUATOR / MÉTRICAS
# ======================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ======================
# OPEN TELEMETRY
# ======================

# 🚀 Endpoint HTTP do collector (usar porta HTTP: 4318)
otel.exporter.otlp.endpoint=http://sentinel-otel:4318

# Nome do serviço (aparece no Grafana/Tempo)
otel.service.name=eventmaster-api

# Habilita exportadores OTLP
otel.metrics.exporter=otlp
otel.traces.exporter=otlp
otel.logs.exporter=otlp

# Instrumentações extras
otel.instrumentation.http-server.enabled=true
otel.instrumentation.runtime-metrics.enabled=true
otel.instrumentation.common.default-enabled=true

# ======================
# NOTAS
# ======================
# - Dentro do Docker, o host "eventmaster-db" é resolvido automaticamente via rede do compose.
# - O OTEL Collector (sentinel-otel) está exposto em http://sentinel-otel:4318.
# - O nome do serviço aparece no painel do Grafana/Tempo como "EventMaster_API".
