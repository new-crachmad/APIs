version: '3.8'

services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: pokemon_logs
    ports:
      - "5434:5432"  # Porta livre
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sentinel
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Pokémon instrumentada com OpenTelemetry
  api:
    build:
      context: .
    container_name: pokemon-api
    ports:
      - "3003:3000"  # Porta livre
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - sentinel

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3004:3000"  # Porta livre
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - sentinel

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9092:9090"  # Porta livre
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sentinel

  # Loki (single-node)
  loki:
    image: grafana/loki:2.9.4
    ports:
      - "3102:3100"  # Porta livre
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - sentinel

  # Tempo
  tempo:
    image: grafana/tempo:latest
    user: "root"
    command: ["-config.file=/etc/tempo.yaml", "-log.level=info"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "3203:3200"
      - "3204:3201"
      - "3205:3202"
    networks:
      - sentinel
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./config/otel-config.yaml:/etc/otel-config.yaml
    ports:
      - "4319:4317"
      - "4320:4318"
      - "9465:9464"
    depends_on:
      - prometheus
      - tempo
    networks:
      - sentinel
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:13133/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  grafana-storage:
  pgdata:
  tempo-data:

networks:
  sentinel:
