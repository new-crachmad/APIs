auth_enabled: false   # Desabilita autenticação (apenas para desenvolvimento)

server:
  http_listen_port: 3100    # Porta HTTP para consulta e ingestão
  grpc_listen_port: 9095    # Porta gRPC (para Promtail ou OTEL Collector)

ingester:
  chunk_idle_period: 5m
  max_chunk_age: 1h
  chunk_target_size: 1048576
  chunk_retain_period: 30s
  lifecycler:
    ring:
      kvstore:
        store: inmemory          # Mantido, mas não causa erro em single-node
      replication_factor: 1

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h

chunk_store_config:
  max_look_back_period: 168h

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h
